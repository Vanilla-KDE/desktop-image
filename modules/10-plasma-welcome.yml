name: plasma-welcome
type: dpkg-buildpackage
source:
  type: git
  url: https://github.com/Vanilla-KDE/plasma-welcome.git
  tag: v6.6.5
modules:
  - name: plasma-welcome-deps-install
    type: apt
    sources:
      - packages:
        - debhelper-compat
        - dh-sequence-kf6
        - pkg-kde-tools
        - dh-sequence-qmldeps
        - cmake
        - extra-cmake-modules
        - kirigami-addons-dev
        - libkf6config-dev
        - libkf6configwidgets-dev
        - libkf6coreaddons-dev
        - libkf6dbusaddons-dev
        - libkf6i18n-dev
        - libkf6jobwidgets-dev
        - libkf6kcmutils-dev
        - libkf6kio-dev
        - libkf6newstuff-dev
        - libkf6notifications-dev
        - libkf6service-dev
        - libkf6svg-dev
        - libkf6userfeedback-dev
        - libkf6windowsystem-dev
        - libkirigami-dev
        - libplasma-dev
        - milou
        - plasma-nm
        - qml6-module-org-kde-plasma-plasma5support
        - qt6-base-dev
        - qt6-declarative-dev
        - qt6-declarative-private-dev
        - qt6-svg-dev
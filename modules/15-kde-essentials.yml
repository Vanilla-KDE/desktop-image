name: kde-essentials
type: apt
sources:
  - packages:
    - plasma-desktop
    - sddm

    - udisks2
    - upower

    - kde-inotify-survey
    - libpam-fprintd
    - webext-plasma-browser-integration

modules:
  - name: sddm-theme
    type: shell
    sources:
      - type: git
        url: https://github.com/Vanilla-KDE/vanilla-sddm
        tag: v0.1
    commands:
      - mkdir -p /usr/share/sddm/themes
      - mv /sources/sddm-theme/vanilla-sddm /usr/share/sddm/themes/vanilla

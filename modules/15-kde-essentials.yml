name: kde-essentials
type: apt
sources:
  - packages:
    - plasma-desktop

    - udisks2
    - upower

    - kde-inotify-survey
    - libpam-fprintd

modules:
  - name: plasma-build-deps
    type: apt
    sources:
      - packages:
        - cmake
        - extra-cmake-modules
        - build-essential

  - name: plasma-setup
    type: shell
    sources:
      - url: https://invent.kde.org/plasma/plasma-setup.git
        type: git
        tag: v6.7.90
    commands:
      - cd /sources/plasma-setup
      - cmake -S plasma-setup -B plasma-setup/build/
      - cmake --build plasma-setup/build/ --parallel
      - cmake --install plasma-setup/build/
      - systemd-sysusers
      - systemctl enable plasma-setup.service

  - name: plasma-login-manager
    type: shell
    sources:
      - url: https://invent.kde.org/plasma/plasma-login-manager.git
        type: git
        tag: v6.7.4
    commands:
      - cd /sources/plasma-login-manager
      - cmake -S plasma-login-manager -B plasma-login-manager/build && make install -C plasma-login-manager/build
      - systemd-sysusers
      - systemctl enable plasmalogin


